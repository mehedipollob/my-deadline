<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#635bff">
    <title>My Deadline</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-shell">
        <div class="overlay" id="overlay"></div>

        <aside class="drawer" id="drawer" aria-hidden="true">
            <div class="drawer-header">
                <div>
                    <span class="eyebrow">STAY ON TRACK</span>
                    <h2>New assignment</h2>
                </div>
                <button class="icon-button" id="drawerClose">✕</button>
            </div>

            <form id="assignmentForm" autocomplete="off">
                <div class="field">
                    <label for="assignmentName">Assignment name *</label>
                    <input type="text" id="assignmentName" placeholder="e.g. TypeScript Assignment" required>
                </div>

                <div class="field">
                    <label for="subject">Subject *</label>
                    <input type="text" id="subject" placeholder="e.g. Web Development" required>
                </div>

                <div class="field">
                    <label for="deadline">Submission deadline</label>
                    <p class="field-hint">Leave blank if there is no due date.</p>
                    <input type="datetime-local" id="deadline">
                </div>

                <div class="field">
                    <label for="priority">Priority</label>
                    <select id="priority">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="field">
                    <div>
                        <label>Reminders</label>
                    </div>
                    <div class="reminder-chips" id="reminderChips">
                        <label class="chip"><input type="checkbox" value="1440" checked><span>1 day</span></label>
                        <label class="chip"><input type="checkbox" value="360" checked><span>6 hours</span></label>
                        <label class="chip"><input type="checkbox" value="60" checked><span>1 hour</span></label>
                    </div>
                </div>

                <button type="submit" class="add-button">＋ Save assignment</button>
            </form>
        </aside>

        <header class="header">
            <div class="header-content">
                <button class="icon-button" id="menuToggle" type="button">＋</button>
                <div class="header-title">
                    <h1>My Deadline</h1>
                </div>
                <button class="icon-button" id="themeToggle" type="button">☾</button>
            </div>
        </header>

        <main class="container">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button type="button" class="primary-btn" onclick="document.getElementById('menuToggle').click()" style="flex:1;">＋ Add Manually</button>
                <button type="button" id="syncClassroomBtn" class="primary-btn" style="flex:1; background: var(--surface); color: var(--primary); border: 1.5px solid var(--primary);">🎓 Sync Classroom</button>
            </div>

            <section class="stats">
                <div class="stat">
                    <span class="stat-label">Active</span>
                    <strong id="activeCount">0</strong>
                </div>
                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <strong id="completedCount">0</strong>
                </div>
            </section>

            <section>
                <div class="section-heading">
                    <h2>My assignments</h2>
                    <span id="totalCount">0 tasks</span>
                </div>
                <div id="assignmentList"></div>
            </section>
        </main>

        <div id="toastHost" class="toast-host"></div>
    </div>

    <script type="module" src="./script.js"></script>
</body>
</html>
