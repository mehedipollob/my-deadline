<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#4f46e5">

    <meta name="description"
          content="Manage your assignment deadlines">

    <title>My Deadline</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== Overlay behind the drawer ===== -->
    <div class="overlay" id="overlay"></div>

    <!-- ===== Hamburger drawer (Add Assignment) ===== -->
    <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Add assignment">

        <div class="drawer-header">
            <div>
                <h2>New Assignment</h2>
                <p class="drawer-sub">Fill in the details below</p>
            </div>

            <button class="icon-button"
                    id="drawerClose"
                    aria-label="Close menu">
                ✕
            </button>
        </div>

        <form id="assignmentForm" autocomplete="off">

            <div class="field">
                <label for="assignmentName">Assignment Name</label>
                <input
                    type="text"
                    id="assignmentName"
                    placeholder="e.g. TypeScript Assignment"
                    required
                >
            </div>

            <div class="field">
                <label for="subject">Subject</label>
                <input
                    type="text"
                    id="subject"
                    placeholder="e.g. Web Development"
                    required
                >
            </div>

            <div class="field">
                <label for="deadline">Submission Deadline</label>
                <input
                    type="datetime-local"
                    id="deadline"
                    required
                >
            </div>

            <div class="field">
                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>
            </div>

            <!-- ===== Reminder picker ===== -->
            <div class="field">
                <label>Reminders</label>
                <p class="field-hint">
                    When should we notify you before the deadline?
                </p>

                <div class="reminder-chips" id="reminderChips">

                    <label class="chip">
                        <input type="checkbox" value="10080">
                        <span>1 week</span>
                    </label>

                    <label class="chip">
                        <input type="checkbox" value="1440" checked>
                        <span>1 day</span>
                    </label>

                    <label class="chip">
                        <input type="checkbox" value="360" checked>
                        <span>6 hours</span>
                    </label>

                    <label class="chip">
                        <input type="checkbox" value="60" checked>
                        <span>1 hour</span>
                    </label>

                    <label class="chip">
                        <input type="checkbox" value="30">
                        <span>30 min</span>
                    </label>

                    <label class="chip">
                        <input type="checkbox" value="10">
                        <span>10 min</span>
                    </label>

                </div>
            </div>

            <button type="submit" class="add-button">
                + Add Assignment
            </button>

        </form>

    </aside>

    <!-- ===== Header ===== -->
    <header class="header">
        <div class="header-content">

            <button class="icon-button"
                    id="menuToggle"
                    aria-label="Open menu"
                    aria-controls="drawer"
                    aria-expanded="false">
                ☰
            </button>

            <div class="header-title">
                <h1>My Deadline</h1>
                <p>Stay organized. Never miss a deadline.</p>
            </div>

            <button class="icon-button"
                    id="themeToggle"
                    aria-label="Toggle theme">
                🌙
            </button>

        </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="container">

        <section class="assignment-section">

            <div class="section-heading">
                <h2>My Assignments</h2>
                <span id="totalCount">0 tasks</span>
            </div>

            <div class="stats">

                <div class="stat">
                    <span class="stat-label">Active</span>
                    <strong id="activeCount">0</strong>
                </div>

                <div class="stat">
                    <span class="stat-label">Completed</span>
                    <strong id="completedCount">0</strong>
                </div>

            </div>

            <div id="assignmentList">
                <!-- Cards will render here -->
            </div>

        </section>

    </main>

    <footer>
        <p>Made for your academic success ❤️</p>
    </footer>

    <!-- ===== Toast host ===== -->
    <div id="toastHost" class="toast-host"></div>

    <script type="module" src="/script.js"></script>

</body>
</html>
