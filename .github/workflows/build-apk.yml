
name: Build My Deadline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Generate debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure APK signing
        run: |
          cat >> android/gradle.properties <<EOF
          MYAPP_STORE_FILE=$HOME/.android/debug.keystore
          MYAPP_STORE_PASSWORD=android
          MYAPP_KEY_ALIAS=androiddebugkey
          MYAPP_KEY_PASSWORD=android
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          content = path.read_text()

          signing = """
          android {
              signingConfigs {
                  debug {
                      storeFile file(MYAPP_STORE_FILE)
                      storePassword MYAPP_STORE_PASSWORD
                      keyAlias MYAPP_KEY_ALIAS
                      keyPassword MYAPP_KEY_PASSWORD
                  }
              }
          }
          """

          if "signingConfigs {" not in content:
              content = content.replace("android {", signing, 1)

          path.write_text(content)
          PY

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Get Android SHA-1
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Verify APK signing certificate
        run: |
          apksigner verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Deadline-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
