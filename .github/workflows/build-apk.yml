name: Build My Deadline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Inject Google Auth Native Code
        run: |
          # 1. Update strings.xml safely
          STRINGS_FILE="android/app/src/main/res/values/strings.xml"
          sed -i '/server_client_id/d' $STRINGS_FILE
          sed -i 's|</resources>|    <string name="server_client_id">912911574847-aefj2rdg0ijld0ld1nph8ik6q8pcqail.apps.googleusercontent.com</string>\n</resources>|' $STRINGS_FILE
          
          # 2. Completely overwrite MainActivity.java to guarantee correct formatting
          MAIN_ACTIVITY="android/app/src/main/java/com/mydeadline/app/MainActivity.java"
          cat > $MAIN_ACTIVITY << 'EOF'
          package com.mydeadline.app;

          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import com.codetrixstudio.capacitor.GoogleAuth.GoogleAuth;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  this.registerPlugin(GoogleAuth.class);
              }
          }
          EOF
          
          echo "Google Auth native configuration injected successfully."

      - name: Sync Capacitor (Forces Plugin Registration)
        run: npx cap sync android

      - name: Verify Plugin Registration
        run: |
          # Manually add the plugin to capacitor.plugins.json if cap sync missed it
          PLUGINS_JSON="android/app/src/main/assets/capacitor.plugins.json"
          if [ -f "$PLUGINS_JSON" ]; then
            if ! grep -q "GoogleAuth" "$PLUGINS_JSON"; then
              echo "Forcing GoogleAuth plugin registration..."
              # Use python to safely add the plugin to the JSON array
              python3 -c "
          import json
          with open('$PLUGINS_JSON', 'r') as f:
              plugins = json.load(f)
          plugins.append({'pkg': '@codetrix-studio/capacitor-google-auth', 'classpath': 'com.codetrixstudio.capacitor.GoogleAuth.GoogleAuth'})
          with open('$PLUGINS_JSON', 'w') as f:
              json.dump(plugins, f, indent=2)
          "
            else
              echo "GoogleAuth already registered."
            fi
          else
            echo "capacitor.plugins.json not found!"
            exit 1
          fi

      - name: Prepare permanent signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/my-deadline-release.jks"
          test -s "$RUNNER_TEMP/signing/my-deadline-release.jks"

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          content = path.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """

          if "signingConfigs {" not in content:
              content = content.replace("android {", "android {\n" + signing, 1)

          build = re.search(r'buildTypes\s*\{', content)
          if not build:
              raise SystemExit("Could not find buildTypes block")

          release = re.search(r'release\s*\{', content[build.end():])
          if release:
              pos = build.end() + release.end()
              if "signingConfig signingConfigs.release" not in content:
                  content = content[:pos] + "\n            signingConfig signingConfigs.release" + content[pos:]
          else:
              pos = build.end()
              content = content[:pos] + "\n        release {\n            signingConfig signingConfigs.release\n        }\n" + content[pos:]

          path.write_text(content)
          print("Release signing configured successfully.")
          PY

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/my-deadline-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Deadline-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
